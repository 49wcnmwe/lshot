name: LShot Windows build
on:
  workflow_dispatch:
  pull_request:
    branches: [master2]
permissions:
  contents: read
concurrency:
  group: lshot-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
        working-directory: cpp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: qt
        with:
          path: cpp/.sdk/6.11.0/msvc2022_64
          key: qt-6.11.0-x64-${{ hashFiles('cpp/scripts/install_qt.py') }}
      - if: steps.qt.outputs.cache-hit != 'true'
        run: |
          python -m pip install py7zr==1.1.4
          python scripts/install_qt.py
          if ($LASTEXITCODE -ne 0) { throw 'Qt setup failed' }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: cpp/native -> ../build/msvc/native
      - name: Build application and tests
        run: .\scripts\build.ps1 -Configuration Release -SkipTests -NoUpdates -Targets jietuba_cpp,jietuba_mint_tests,jietuba_canvas_items_tests,jietuba_ui_widgets_tests,jietuba_screenshot_window_tests,jietuba_save_image_dialog_tests
      - name: Test capture changes
        run: |
          ctest --test-dir build/msvc -C Release --output-on-failure -R 'mint_capture|canvas_items|ui_widgets|screenshot_window|save_image_dialog' -E '_desktop$|_windows_parity$'
          if ($LASTEXITCODE -ne 0) { throw 'Capture regression tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: lshot-windows-x64
          path: cpp/dist/Release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lshot-test-reports
          path: cpp/build/msvc/test_reports/
